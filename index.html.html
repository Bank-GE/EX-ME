<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spending</title>
<style>
  :root{
    --bg:#0D0D0F; --card:#1B1B1E; --card-soft:#232326; --line:#323236;
    --text:#F5F3EE; --muted:#8E8B85; --hero:#BFE0EC; --hero-text:#132029;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', Helvetica, Arial, sans-serif;}
  #root{height:100dvh; display:flex; justify-content:center; overflow:hidden;}
  #shell{width:100%; max-width:430px; height:100%; display:flex; flex-direction:column;}
  #content{flex:1; min-height:0; padding:max(12px, env(safe-area-inset-top)) 16px 4px; box-sizing:border-box;}
  #content.page-add{display:flex; flex-direction:column; overflow:hidden;}
  #content.page-log{display:block; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  button{font-family:inherit; -webkit-appearance:none; appearance:none;}
  input[type=file]{display:none;}

  .addwrap{flex:1; display:flex; flex-direction:column; gap:10px; min-height:0; height:100%;}
  .hdr{display:flex; justify-content:space-between; align-items:baseline; flex-shrink:0;}
  .eyebrow{font-size:11px; font-weight:700; letter-spacing:0.8px; color:var(--muted);}

  .hero{flex-shrink:0; background:var(--hero); color:var(--hero-text); border-radius:22px; padding:14px 18px;
    display:flex; justify-content:space-between; align-items:center;}
  .hero .label{font-size:10px; font-weight:700; letter-spacing:0.7px; opacity:.65; margin-bottom:4px;}
  .hero .big{font-size:28px; font-weight:800; letter-spacing:-0.6px;}
  .hero .side{text-align:right; font-size:12px; font-weight:600; opacity:.75; line-height:1.5;}

  .card{background:var(--card); border-radius:20px; padding:10px 14px; box-sizing:border-box; overflow:hidden;}
  .card-header{display:flex; justify-content:space-between; flex-shrink:0;}
  .card-header .hint{font-size:10px; color:var(--muted);}
  .card-header .label{font-size:10px; font-weight:700; letter-spacing:0.7px; color:var(--muted);}

  .amount-card{flex:2.5 1 0%; min-height:0; display:flex; flex-direction:column; justify-content:space-between;}
  .amount-row{display:flex; align-items:center; justify-content:space-between;}
  .amount-num{font-size:40px; font-weight:800; letter-spacing:-1px; color:#4A4A4E;}
  .amount-num.active{color:var(--text);}
  .ghostbtns{display:flex; gap:7px;}
  .ghostbtn{width:42px; height:42px; border-radius:999px; border:1.5px solid var(--line); background:transparent;
    color:var(--text); font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .quickadds{display:flex; gap:7px;}
  .quickadd{flex:1; padding:13px 0; border-radius:15px; border:none; background:#2A2A2D; color:var(--text);
    font-size:14px; font-weight:700; cursor:pointer;}

  .cat-card{flex:1.8 1 0%; min-height:0; display:flex; flex-direction:column; gap:6px;}
  .tag-card{flex:2.3 1 0%; min-height:0; display:flex; flex-direction:column; gap:6px;}
  .pillrows{flex:1; display:flex; flex-direction:column; gap:6px; min-height:0;}
  .pillrow{display:flex; gap:7px; flex:1; min-height:0;}
  .pill{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:0 6px;
    border-radius:999px; font-size:13px; font-weight:600; border:1.5px solid var(--line); background:transparent;
    color:var(--text); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pill .dot{width:6px; height:6px; border-radius:999px; flex-shrink:0;}

  .navwrap{display:grid; grid-template-columns:1fr 96px 1fr; align-items:end; column-gap:12px; padding:10px 16px calc(18px + env(safe-area-inset-bottom)); box-sizing:border-box;}
  .navphoto{height:52px; border-radius:999px; padding:0; border:1.5px solid var(--line);
    background-color:transparent; background-size:cover; background-position:center; color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .navphoto.has-photo{border-color:var(--text);}
  .navadd{height:92px; border-radius:999px; border:none; font-size:17px; font-weight:800;
    background:#3A3A3E; color:#6E6B65; cursor:not-allowed; box-shadow:0 10px 22px rgba(0,0,0,0.35);}
  .navadd.can{background:#FFFFFF; color:#0D0D0F; cursor:pointer;}
  .navadd.onlog{background:transparent; color:var(--text); box-shadow:none; border:1.5px solid var(--line); cursor:pointer;}
  .navlog{height:52px; border-radius:999px; font-size:15px; font-weight:700; border:1.5px solid var(--line);
    background:transparent; color:var(--text); cursor:pointer;}
  .navlog.active{border-color:var(--text);}

  .logrow{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .monthnav{display:flex; align-items:center; gap:4px; background:var(--card); border-radius:999px; padding:4px 6px;}
  .monthnav button{width:26px; height:26px; border-radius:999px; border:none; background:transparent; color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .monthnav span{font-size:14px; font-weight:600; min-width:78px; text-align:center;}
  .loghero{background:var(--hero); color:var(--hero-text); border-radius:22px; padding:18px; margin-bottom:14px;}
  .loghero .label{font-size:10px; font-weight:700; letter-spacing:0.7px; opacity:.65; margin-bottom:6px;}
  .loghero .big{font-size:32px; font-weight:800; letter-spacing:-0.8px; margin-bottom:12px;}
  .chart{display:flex; align-items:flex-end; gap:8px; height:84px;}
  .chart .bar-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .chart .bar{width:100%; border-radius:6px 6px 0 0; min-height:4px;}
  .chart .bar-label{font-size:9px; opacity:.7; margin-top:4px;}
  .entries-card{background:var(--card); border-radius:20px; padding:16px; margin-bottom:14px;}
  .entries-title{font-size:16px; font-weight:700; margin-bottom:10px;}
  .empty{font-size:14px; color:var(--muted); padding:8px 0;}
  .entry{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); gap:10px;}
  .entry:last-child{border-bottom:none;}
  .entry .cats{display:flex; align-items:center; gap:6px; margin-bottom:3px; flex-wrap:wrap;}
  .entry .cat{display:flex; align-items:center; gap:4px; font-size:13px; font-weight:600;}
  .entry .cat .dot{width:7px; height:7px; border-radius:999px;}
  .entry .meta{font-size:12px; color:var(--muted);}
  .entry .right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .entry .amt{font-size:15px; font-weight:700;}
  .entry .del{width:30px; height:30px; border-radius:999px; border:none; background:transparent; color:var(--muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .exportbtn{width:100%; padding:15px 0; border-radius:14px; border:1.5px solid var(--text); font-size:15px; font-weight:700;
    background:transparent; color:var(--text); display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer; margin-bottom:10px;}
  .exportbtn:disabled{color:#5A574F; border-color:#3A3A3E; cursor:not-allowed;}

  .fallback{padding:32px 24px; text-align:center;}
  .fallback h2{font-size:20px; margin:0 0 12px;}
  .fallback p{font-size:14px; color:var(--muted); line-height:1.6; margin:0 0 10px;}
</style>
</head>
<body>
<div id="root"><div id="shell">
  <div id="content">
    <div class="fallback">
      <h2>กำลังโหลด…</h2>
      <p>ดึงข้อมูลจาก Google Sheet</p>
    </div>
  </div>
  <div id="nav" class="navwrap"></div>
</div></div>
<input id="photoInput" type="file" accept="image/*">

<script>
// ---- 1) วาง URL ของ Apps Script Web App ที่ deploy ไว้ตรงนี้ ----
// หน้าตาประมาณ: https://script.google.com/macros/s/XXXXXXXXXXXX/exec
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzvg-_7jnjUqomP89KJhRHFqXdSJM7ZvsRda3Mc1z-T9UFIFBX1ZDGj0bnulQF766pZ/exec";
// -----------------------------------------------------------------

const CATEGORIES = [
  { key: "Food", color: "#A7E8CB" },
  { key: "Shopping", color: "#8FC9EE" },
  { key: "Service", color: "#C7B4F2" },
  { key: "Utility", color: "#EAD26E" },
  { key: "Other", color: "#F0A18C" },
];
const CATEGORY_ROWS = [["Food","Shopping","Service"], ["Utility","Other"]];
const TAG_ROWS = [["Cash","Credit Card","Self"], ["Tool","Work","GPE"], ["CNMP","Family"]];
const QUICK_ADDS = [1,10,100,1000];
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const ICONS = {
  chevronLeft: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
  chevronRight: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  download: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  camera: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
};

let state = {
  page: "add", expenses: [], loading: true,
  amount: 0, history: [], selCats: [], selTags: [], photo: null, saving: false,
  viewYear: new Date().getFullYear(), viewMonth: new Date().getMonth(),
};

function fmtTHB(n){ return (n||0).toLocaleString("en-US", {maximumFractionDigits:0}); }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"}); }
function fmtDay(iso){ const d=new Date(iso); return d.getDate()+" "+MONTH_NAMES[d.getMonth()]; }
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function catColor(key){ const c=CATEGORIES.find(c=>c.key===key); return c?c.color:"#8E8B85"; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function compressImage(file, maxW, quality, cb){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL("image/jpeg", quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function loadExpenses(){
  const res = await fetch(APPS_SCRIPT_URL + "?action=list");
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "load failed");
  return json.expenses;
}
async function saveExpense(entry){
  // text/plain avoids a CORS preflight against the Apps Script endpoint
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "add", entry }),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "save failed");
}
async function removeExpense(id){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "delete", id }),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "delete failed");
}

function addIncrement(n){ state.amount+=n; state.history.push(n); render(); }
function backspace(){ if(!state.history.length) return; const last=state.history.pop(); state.amount=Math.max(0,state.amount-last); render(); }
function clearAmount(){ state.amount=0; state.history=[]; render(); }
function toggleCat(k){ const i=state.selCats.indexOf(k); if(i>-1) state.selCats.splice(i,1); else state.selCats.push(k); render(); }
function toggleTag(t){ const i=state.selTags.indexOf(t); if(i>-1) state.selTags.splice(i,1); else state.selTags.push(t); render(); }
function canSave(){ return state.amount>0 && state.selCats.length>0 && !state.saving; }

async function handleAdd(){
  if(!canSave()) return;
  state.saving = true; render();
  const entry = {
    id: Date.now()+"-"+Math.random().toString(36).slice(2,8),
    timestamp: new Date().toISOString(),
    amount: state.amount,
    categories: state.selCats.slice(),
    tags: state.selTags.slice(),
    photo: state.photo || null,
  };
  try {
    await saveExpense(entry);
    state.expenses.push(entry);
    state.amount=0; state.history=[]; state.selCats=[]; state.selTags=[]; state.photo=null;
  } catch (err) {
    alert("บันทึกไม่สำเร็จ: " + err.message);
  } finally {
    state.saving = false; render();
  }
}
async function handleDelete(id){
  try {
    await removeExpense(id);
    state.expenses = state.expenses.filter(e => e.id !== id);
    render();
  } catch (err) {
    alert("ลบไม่สำเร็จ: " + err.message);
  }
}
function shiftMonth(delta){
  let m=state.viewMonth+delta, y=state.viewYear;
  if(m<0){m=11;y-=1;} if(m>11){m=0;y+=1;}
  state.viewMonth=m; state.viewYear=y; render();
}
function setPage(p){ state.page=p; render(); }
function monthExpenses(){
  return state.expenses.filter(e=>{
    const d=new Date(e.timestamp);
    return d.getFullYear()===state.viewYear && d.getMonth()===state.viewMonth;
  });
}
function exportExcel(){
  const rows = state.expenses.slice().sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
  let html = '<table><tr><th>Date</th><th>Time</th><th>Amount (THB)</th><th>Categories</th><th>Tags</th><th>Photo</th></tr>';
  rows.forEach(e=>{
    const d=new Date(e.timestamp);
    html += '<tr><td>'+d.toLocaleDateString("en-CA")+'</td><td>'+d.toLocaleTimeString("en-GB")+'</td><td>'+e.amount+'</td><td>'+esc(e.categories.join(", "))+'</td><td>'+esc(e.tags.join(", "))+'</td><td>'+(e.photo?"Yes":"No")+'</td></tr>';
  });
  html += '</table>';
  const blob = new Blob(['\ufeff'+html], {type:"application/vnd.ms-excel"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download="expenses-"+state.viewYear+"-"+String(state.viewMonth+1).padStart(2,"0")+".xls";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderPillRows(rows, active, colorOf){
  return rows.map(row => '<div class="pillrow">' + row.map(item => {
    const isActive = active.includes(item);
    const dot = colorOf ? colorOf(item) : null;
    const style = isActive
      ? (dot ? `border-color:${dot}; background:${dot}26; color:var(--text);` : `border-color:var(--text); background:var(--text); color:#0D0D0F;`)
      : `border-color:var(--line); background:transparent; color:var(--text);`;
    return `<button class="pill" style="${style}" data-action="${colorOf?'toggleCat':'toggleTag'}" data-val="${esc(item)}">`
      + (dot ? `<span class="dot" style="background:${dot}"></span>` : "") + esc(item) + `</button>`;
  }).join("") + '</div>').join("");
}

function renderAddPage(){
  const today = new Date();
  const todayEntries = state.expenses.filter(e=>isSameDay(new Date(e.timestamp), today));
  const todayTotal = todayEntries.reduce((s,e)=>s+e.amount,0);
  const weekStart = new Date(today); weekStart.setDate(today.getDate()-6); weekStart.setHours(0,0,0,0);
  const weekTotal = state.expenses.filter(e=>new Date(e.timestamp)>=weekStart).reduce((s,e)=>s+e.amount,0);

  return `
  <div class="addwrap">
    <div class="hdr">
      <span class="eyebrow">NEW ENTRY</span>
      <span class="eyebrow">${today.getDate()} ${MONTH_NAMES[today.getMonth()].toUpperCase()}</span>
    </div>
    <div class="hero">
      <div><div class="label">SPENT TODAY</div><div class="big">฿${fmtTHB(todayTotal)}</div></div>
      <div class="side"><div>${todayEntries.length} ${todayEntries.length===1?"entry":"entries"}</div><div>Week ฿${fmtTHB(weekTotal)}</div></div>
    </div>
    <div class="card amount-card">
      <div class="card-header"><span class="label">AMOUNT / THB</span></div>
      <div class="amount-row">
        <div class="amount-num ${state.amount>0?'active':''}">${state.amount.toLocaleString()}</div>
        <div class="ghostbtns"><button class="ghostbtn" data-action="backspace">⌫</button><button class="ghostbtn" data-action="clearAmount">C</button></div>
      </div>
      <div class="quickadds">${QUICK_ADDS.map(n=>`<button class="quickadd" data-action="addIncrement" data-val="${n}">+${n.toLocaleString()}</button>`).join("")}</div>
    </div>
    <div class="card cat-card">
      <div class="card-header"><span class="label">CATEGORY</span><span class="hint">Multi-select</span></div>
      <div class="pillrows">${renderPillRows(CATEGORY_ROWS, state.selCats, catColor)}</div>
    </div>
    <div class="card tag-card">
      <div class="card-header"><span class="label">TAGS</span><span class="hint">Optional</span></div>
      <div class="pillrows">${renderPillRows(TAG_ROWS, state.selTags, null)}</div>
    </div>
  </div>`;
}

function renderLogPage(){
  const mExp = monthExpenses();
  const monthTotal = mExp.reduce((s,e)=>s+e.amount,0);
  const catTotals = CATEGORIES.map(c => ({...c, total: mExp.filter(e=>e.categories.includes(c.key)).reduce((s,e)=>s+e.amount,0)}));
  const chartData = catTotals.filter(c=>c.total>0);
  const maxTotal = Math.max(1, ...chartData.map(c=>c.total));
  const sorted = mExp.slice().sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));

  return `
    <div class="logrow">
      <span class="eyebrow">LOG</span>
      <div class="monthnav">
        <button data-action="shiftMonth" data-val="-1">${ICONS.chevronLeft}</button>
        <span>${MONTH_NAMES[state.viewMonth]} ${state.viewYear}</span>
        <button data-action="shiftMonth" data-val="1">${ICONS.chevronRight}</button>
      </div>
    </div>
    <div class="loghero">
      <div class="label">MONTH TOTAL</div>
      <div class="big">฿${fmtTHB(monthTotal)}</div>
      ${chartData.length ? `<div class="chart">${chartData.map(c=>`
        <div class="bar-wrap"><div class="bar" style="height:${Math.max(6,(c.total/maxTotal)*100)}%; background:${c.color}"></div><div class="bar-label">${c.key}</div></div>`).join("")}</div>` : ""}
    </div>
    <div class="entries-card">
      <div class="entries-title">Entries</div>
      ${sorted.length===0 ? '<div class="empty">No expenses this month yet.</div>' : sorted.map(e=>`
        <div class="entry">
          <div style="min-width:0; flex:1;">
            <div class="cats">${e.categories.map(c=>`<span class="cat"><span class="dot" style="background:${catColor(c)}"></span>${esc(c)}</span>`).join("")}</div>
            <div class="meta">${fmtDay(e.timestamp)} · ${fmtTime(e.timestamp)}${e.tags.length ? " · "+esc(e.tags.join(", ")) : ""}</div>
          </div>
          <div class="right"><div class="amt">฿${fmtTHB(e.amount)}</div><button class="del" data-action="deleteEntry" data-val="${e.id}">${ICONS.trash}</button></div>
        </div>`).join("")}
    </div>
    <button class="exportbtn" data-action="exportExcel" ${sorted.length===0?"disabled":""}>${ICONS.download} Export to Excel</button>
  `;
}

function renderNav(){
  const active = canSave();
  const photoStyle = state.photo ? `background-image:url(${state.photo});` : "";
  return `
    <button class="navphoto ${state.photo?'has-photo':''}" style="${photoStyle}" data-action="photoTap">${state.photo?"":ICONS.camera}</button>
    <button class="navadd ${state.page==='add' ? (active?'can':'') : 'onlog'}" data-action="navAdd" ${state.page==='add' && !active ? 'disabled':''}>${state.saving?"Saving…":"Add"}</button>
    <button class="navlog ${state.page==='log'?'active':''}" data-action="navLog">Log</button>
  `;
}

function render(){
  const content = document.getElementById("content");
  content.className = state.page==="add" ? "page-add" : "page-log";
  if (state.loading) {
    content.innerHTML = '<div class="fallback"><h2>กำลังโหลด…</h2><p>ดึงข้อมูลจาก Firebase</p></div>';
  } else {
    content.innerHTML = state.page==="add" ? renderAddPage() : renderLogPage();
  }
  const nav = document.getElementById("nav");
  nav.className = "navwrap";
  nav.innerHTML = renderNav();
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action, val = btn.dataset.val;
  if (action==="addIncrement") addIncrement(Number(val));
  else if (action==="backspace") backspace();
  else if (action==="clearAmount") clearAmount();
  else if (action==="toggleCat") toggleCat(val);
  else if (action==="toggleTag") toggleTag(val);
  else if (action==="shiftMonth") shiftMonth(Number(val));
  else if (action==="deleteEntry") handleDelete(val);
  else if (action==="exportExcel") exportExcel();
  else if (action==="navAdd") { if (state.page==="add") handleAdd(); else setPage("add"); }
  else if (action==="navLog") setPage("log");
  else if (action==="photoTap") {
    if (state.photo) { state.photo = null; render(); }
    else document.getElementById("photoInput").click();
  }
});
document.getElementById("photoInput").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  compressImage(file, 480, 0.6, (dataUrl) => { state.photo = dataUrl; render(); });
  e.target.value = "";
});

render();
(async () => {
  try {
    state.expenses = await loadExpenses();
    state.loading = false;
    render();
  } catch (err) {
    document.getElementById("content").innerHTML = `<div class="fallback"><h2>โหลดข้อมูลไม่สำเร็จ</h2><p>${esc(err.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
